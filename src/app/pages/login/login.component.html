<div class="login-container">
  
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email">
      
      <div class="error-bubble" *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched">
        Por favor, digite um email válido.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password">
      
      <div class="error-bubble" *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched">
        A senha deve ter pelo menos 6 caracteres.
      </div>

      <a href="#" class="forgot-link" (click)="abrirDialogRecuperarSenha(); $event.preventDefault();">
        Esqueci minha senha
      </a>
    </div>

    <button type="submit" class="btn-entrar">
      Entrar
    </button>

    <div class="error-bubble form-general-error" *ngIf="formInvalido">
      Preencha todos os campos corretamente.
    </div>
    <div class="error-bubble form-general-error" *ngIf="loginFalhou">
      Email ou senha incorretos.
    </div>
  </form>

  <div class="logos-container">
    <img src="assets/img/unicentro-logo.png" alt="Unicentro" class="logo">
    <img src="assets/img/saude-logo.png" alt="Saúde" class="logo">
  </div>
</div>

<ng-template #dialogRecuperarSenha>
  <h2 mat-dialog-title>Recuperar Senha</h2>
  <mat-dialog-content>
    <p>Informe seu email para redefinir sua senha:</p>
    <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="emailRecuperacao" type="email">
    </mat-form-field>
    <div *ngIf="recuperacaoEmailErro" style="color: #b61629; font-size: 13px; margin-top: 4px;">
      Erro ao enviar. Verifique se o e-mail está correto.
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef.close()">Cancelar</button>
    <button mat-raised-button style="background-color: #d48321; color: white;" (click)="enviarRecuperacaoSenha()">Enviar</button>
  </mat-dialog-actions>
</ng-template>
